name: CI

on:
  push:
    branches: [main, docker]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Minecraft2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Minecraft2/pom.xml
      - name: Unit tests
        run: mvn -B -ntp test

  docker:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./Minecraft2
          push: false
          load: true
          tags: minecraft2:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (console menu starts and exits)
        run: printf '0\n' | docker run --rm -i minecraft2:ci | grep -q "Hasta luego"
