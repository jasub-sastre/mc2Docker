name: minecraft2

services:
  game:
    build: .
    image: minecraft2:dev
    stdin_open: true
    tty: true
    volumes:
      - mundos:/data
    healthcheck:
      test: ["CMD-SHELL", "test -w /data"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  mundos:
